<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="0.55" stop-color="#3a5fe0"/>
      <stop offset="1" stop-color="#5b2fc9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4352"/>
      <stop offset="1" stop-color="#181d25"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d8798"/>
      <stop offset="1" stop-color="#2a313c"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b1030" flood-opacity=".45"/>
    </filter>
    <filter id="bshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#062a1e" flood-opacity=".5"/>
    </filter>
    <clipPath id="scr"><rect x="80" y="44" width="96" height="74" rx="5"/></clipPath>
  </defs>

  <!-- app tile -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#tile)"/>
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#glow)"/>

  <!-- calculator -->
  <g filter="url(#shadow)">
    <rect x="64" y="26" width="128" height="208" rx="22" fill="url(#rim)"/>
    <rect x="67" y="29" width="122" height="202" rx="20" fill="url(#body)"/>
  </g>

  <!-- screen -->
  <rect x="77" y="41" width="102" height="80" rx="7" fill="#0c0f14"/>
  <g clip-path="url(#scr)">
    <rect x="80" y="44" width="96" height="74" fill="#ffffff"/>
    <!-- tab bar -->
    <rect x="80" y="44" width="96" height="14" fill="#2b3442"/>
    <rect x="80" y="46" width="34" height="12" fill="#ffffff"/>
    <rect x="80" y="44" width="34" height="2.5" fill="#2a6fdb"/>
    <rect x="88" y="50" width="18" height="3" rx="1.5" fill="#1c2330"/>
    <rect x="122" y="50" width="16" height="3" rx="1.5" fill="#8d99ab"/>
    <rect x="150" y="50" width="18" height="3" rx="1.5" fill="#8d99ab"/>
    <!-- typeset fraction -->
    <rect x="87" y="66" width="12" height="3" rx="1.5" fill="#1c2330"/>
    <rect x="103" y="64" width="22" height="3" rx="1.5" fill="#1c2330"/>
    <rect x="102" y="70" width="24" height="1.8" fill="#1c2330"/>
    <rect x="108" y="74" width="12" height="3" rx="1.5" fill="#1c2330"/>
    <!-- graph -->
    <line x1="86" y1="104" x2="170" y2="104" stroke="#c4cad4" stroke-width="1.5"/>
    <line x1="128" y1="82" x2="128" y2="116" stroke="#c4cad4" stroke-width="1.5"/>
    <path d="M86 110 C 100 76, 116 76, 128 98 S 156 122, 170 84" fill="none" stroke="#2a6fdb" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- touchpad -->
  <circle cx="128" cy="149" r="17" fill="#2b323d" stroke="#566072" stroke-width="2"/>
  <circle cx="128" cy="149" r="7" fill="#3a4352"/>
  <!-- side keys -->
  <rect x="80" y="140" width="22" height="8" rx="4" fill="#4a5466"/>
  <rect x="80" y="152" width="22" height="8" rx="4" fill="#4a5466"/>
  <rect x="154" y="140" width="22" height="8" rx="4" fill="#4a5466"/>
  <rect x="154" y="152" width="22" height="8" rx="4" fill="#4a5466"/>
  <!-- keypad -->
  <g fill="#d7dde6">
    <rect x="82" y="176" width="20" height="10" rx="5"/><rect x="108" y="176" width="20" height="10" rx="5"/>
    <rect x="134" y="176" width="20" height="10" rx="5"/>
    <rect x="82" y="192" width="20" height="10" rx="5"/><rect x="108" y="192" width="20" height="10" rx="5"/>
    <rect x="134" y="192" width="20" height="10" rx="5"/>
    <rect x="82" y="208" width="20" height="10" rx="5"/><rect x="108" y="208" width="20" height="10" rx="5"/>
    <rect x="134" y="208" width="20" height="10" rx="5"/>
  </g>
  <rect x="160" y="176" width="16" height="42" rx="6" fill="#2a6fdb"/>

  <!-- send badge -->
  <g filter="url(#bshadow)">
    <circle cx="196" cy="196" r="34" fill="#ffffff"/>
    <circle cx="196" cy="196" r="29" fill="url(#badge)"/>
  </g>
  <path d="M196 212 V 182 M182 195 L196 181 L210 195" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
